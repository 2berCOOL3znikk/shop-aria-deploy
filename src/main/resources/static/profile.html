<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Shop — Личный кабинет</title>
    <link rel="stylesheet" href="/styles.css">



<link rel="apple-touch-icon" href="/images/aria-app-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#101418"><link rel="stylesheet" href="/css/platform.css"><link rel="stylesheet" href="/css/control-center.css"></head>
<body>
<div class="bg-mesh"></div>

<nav class="nav-glass">
    <a href="/home.html" class="logo-new">◆ <span class="gradient-text">ARIA</span>Shop</a>
    <div class="nav-links">
        <a href="/index.html" data-i18n="nav.catalog">Каталог</a>
        <a href="/social.html" data-i18n="nav.social">Соц. полка</a>
        <a href="#favorites-list" aria-label="Избранное">♡ Избранное</a>
        <a href="/cart.html" data-i18n="nav.cart">Корзина 🛒 <span id="cart-count" class="cart-badge">0</span></a>
        <a href="/profile.html" class="active" data-i18n="nav.profile">Профиль</a>
        <span id="auth-nav"></span>
        <button id="theme-toggle-btn" onclick="ariaTheme.toggleTheme()" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;font-size:18px;padding:0 8px;" title="Toggle theme">☀</button>
        <button id="lang-toggle-btn" onclick="ariaI18n.cycleLang()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px;">RU</button>
    </div>
</nav>

<main class="container profile-page">
  <h1 data-i18n="profile.title">Мой кабинет</h1>
  <section class="glass-card profile-form">
    <h2 data-i18n="profile.personal">Личная информация</h2>
    <label for="email" data-i18n="profile.email">Email</label>
    <input type="email" id="email" data-i18n-placeholder="profile.email" placeholder="Email" readonly>
    <label for="fullName" data-i18n="profile.fullName">ФИО</label>
    <input type="text" id="fullName" maxlength="100" autocomplete="name" data-i18n-placeholder="profile.fullName" placeholder="ФИО">
    <label for="phone" data-i18n="profile.phone">Телефон</label>
    <input type="tel" id="phone" maxlength="50" autocomplete="tel" data-i18n-placeholder="profile.phone" placeholder="Телефон">
    <label for="address" data-i18n="profile.address">Адрес</label>
    <input type="text" id="address" maxlength="500" autocomplete="street-address" data-i18n-placeholder="profile.address" placeholder="Адрес">
    <button id="profile-save" class="btn-glow" onclick="saveProfile()" data-i18n="profile.save">Сохранить</button>
  </section>
  <section class="glass-card profile-form">
    <h2>Безопасность аккаунта</h2>
    <form id="password-form">
      <label for="current-password">Текущий пароль</label>
      <input id="current-password" type="password" autocomplete="current-password" required maxlength="72">
      <label for="new-password">Новый пароль — от 12 символов</label>
      <input id="new-password" type="password" autocomplete="new-password" required minlength="12" maxlength="72">
      <label for="repeat-password">Повторите новый пароль</label>
      <input id="repeat-password" type="password" autocomplete="new-password" required minlength="12" maxlength="72">
      <p>После смены пароля все ранее выданные сеансы завершатся.</p>
      <button class="btn-glow" type="submit">Изменить пароль</button>
      <p id="password-message" role="status" aria-live="polite"></p>
    </form>
  </section>
  <section class="glass-card profile-orders">
    <h2 data-i18n="profile.orders">Мои заказы</h2>
    <div id="orders"></div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>




<script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/catalog-images.js"></script>
  <script src="/js/page-profile-inline-1.js"></script>
<script src="/js/pwa.js"></script></body>
</html>
