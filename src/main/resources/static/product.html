<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Shop — Карточка товара</title>
    <link rel="stylesheet" href="/styles.css">



<link rel="apple-touch-icon" href="/images/aria-app-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#101418"><link rel="stylesheet" href="/css/platform.css"><link rel="stylesheet" href="/css/control-center.css"></head>
<body>
<div class="bg-mesh"></div>

<nav class="nav-glass">
    <a href="/home.html" class="logo-new">◆ <span class="gradient-text">ARIA</span>Shop</a>
    <div class="nav-links">
        <a href="/index.html" data-i18n="nav.catalog">Каталог</a>
        <a href="/social.html" data-i18n="nav.social">Соц. полка</a>
        <a href="/profile.html#favorites-list" aria-label="Избранное">♡ Избранное</a>
        <a href="/cart.html" data-i18n="nav.cart">Корзина 🛒 <span id="cart-count" class="cart-badge">0</span></a>
        <a href="/profile.html" data-i18n="nav.profile">Профиль</a>
        <span id="auth-nav"></span>
        <button id="theme-toggle-btn" onclick="ariaTheme.toggleTheme()" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;font-size:18px;padding:0 8px;" title="Toggle theme">☀</button>
        <button id="lang-toggle-btn" onclick="ariaI18n.cycleLang()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px;">RU</button>
    </div>
</nav>

<main class="container" style="max-width:1100px;margin:40px auto;padding:0 20px;">
    <a href="/index.html" style="color:var(--text-secondary);text-decoration:none;margin-bottom:20px;display:inline-block;">← Назад в каталог</a>

    <div id="product" style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:20px;">
        <p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px;">Загрузка товара...</p>
    </div>

    <div id="reviews" style="margin-top:60px;">
        <h2 style="margin-bottom:20px;" data-i18n="product.reviews">Отзывы покупателей</h2>
        <div id="reviews-list"></div>
        <div style="margin-top:20px;padding:20px;" class="glass-card">
            <h3 style="margin-bottom:15px;" data-i18n="product.leaveReview">Оставить отзыв</h3>
            <input type="text" id="review-author" data-i18n-placeholder="product.reviewAuthor" placeholder="Ваше имя" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);">
            <textarea id="review-comment" data-i18n-placeholder="product.reviewComment" placeholder="Комментарий" rows="3" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);resize:vertical;"></textarea>
            <select id="review-rating" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);">
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★ (4)</option>
                <option value="3">★★★ (3)</option>
                <option value="2">★★ (2)</option>
                <option value="1">★ (1)</option>
            </select>
            <button class="btn-glow" onclick="submitReview()" data-i18n="product.reviewSubmit">Отправить отзыв</button>
        </div>
    </div>
</main>

<div class="toast-container" id="toast-container"></div>





<script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/catalog-images.js"></script>
  <script src="/js/page-product-inline-1.js"></script>
  <script src="/js/product-mvp.js"></script>
<script src="/js/pwa.js"></script></body>
</html>
