<!doctype html>
<html lang="ru" data-copy-app><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ARIA</title><script src="/js/app-copy-data.js"></script><script src="/js/app-copy.js"></script><script src="/js/theme.js"></script><link rel="stylesheet" href="/css/aria-ui.css"></head>
<body class="ar-page"><header class="ar-topbar"><a class="ar-brand" href="/start.html"><span class="ar-brand-mark">A</span>ARIA</a><div class="ar-controls" data-ui-controls></div></header>
<main class="ar-auth"><section class="ar-panel"><span class="ar-environment" id="auth-workspace-note" hidden></span><h1 data-auth-copy="title"></h1><p class="ar-auth-intro" data-auth-copy="intro"></p><p class="ar-auth-note" id="company-login-note" hidden></p>
<div class="tab-buttons"><button class="tab-btn active" type="button" onclick="switchTab('login')" data-auth-copy="signin"></button><button class="tab-btn" id="register-tab" type="button" onclick="switchTab('register')" data-auth-copy="buyer" hidden></button></div>
<form id="login-form" class="auth-form active" onsubmit="handleLogin(event)" aria-busy="false"><label class="ar-auth-label"><span>Email</span><input id="login-email" name="email" type="email" required autocomplete="username" maxlength="255"></label><label class="ar-auth-label"><span data-auth-copy="password"></span><span class="ar-field-password"><input id="login-password" name="password" type="password" required autocomplete="current-password" maxlength="256"><button class="ar-password-toggle" id="login-password-toggle" type="button" aria-controls="login-password" aria-pressed="false" data-auth-copy="show"></button></span></label><div id="login-error" class="error-message ar-error" role="alert"></div><button class="ar-button" type="submit" data-auth-copy="signin"></button></form>
<form id="register-form" class="auth-form" onsubmit="handleRegister(event)"><label class="ar-auth-label"><span data-auth-copy="name"></span><input id="register-fullName" type="text" required autocomplete="name" maxlength="255"></label><label class="ar-auth-label"><span>Email</span><input id="register-email" type="email" required autocomplete="username" maxlength="255"></label><label class="ar-auth-label"><span data-auth-copy="password"></span><input id="register-password" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><div class="hp-field" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div><input type="hidden" id="captcha-id"><label class="ar-auth-label"><span id="captcha-question"></span><input id="captcha-answer" inputmode="numeric" required autocomplete="off" maxlength="20"></label><div id="register-error" class="error-message ar-error" role="alert"></div><button class="ar-button" type="submit" data-auth-copy="register"></button></form>
<p class="ar-auth-note" data-auth-copy="external"></p><p class="auth-footer" data-company-entry><a id="auth-company-register" class="ar-button secondary" data-auth-copy="company" hidden></a></p><div class="guest-link" data-public-store-link><a href="/index.html" data-auth-copy="storefront"></a></div></section><p class="auth-footer"><a href="/start.html" data-auth-copy="back"></a></p></main>
<script src="/js/auth.js"></script><script src="/js/ui-controls.js"></script><script src="/js/login-page.js"></script><script src="/js/application-shell.js"></script><script src="/js/company-entry.js"></script></body></html>
