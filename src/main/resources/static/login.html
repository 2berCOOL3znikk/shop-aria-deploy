<!DOCTYPE html>
<html lang="ru" data-copy-app>
<head><script src="/js/app-copy-data.js"></script><script src="/js/app-copy.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-copy="text.c7dcda5c6124d5">ARIA Shop — Вход</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            box-sizing: border-box;
        }
        .auth-label { display:block; text-align:left; font-size:13px; font-weight:550; color:var(--text-primary); margin:0 0 7px; }
        .auth-form input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .error-message {
            color: var(--accent-red);
            font-size: 14px;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .guest-link {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .guest-link a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .demo-accounts { margin-top:22px;padding:15px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-surface);font-size:13px;line-height:1.7; }
        .demo-accounts h2 { margin:0 0 7px;font-size:14px;color:var(--text-primary); }
        .demo-accounts p { margin:3px 0;color:var(--text-secondary); }
        .demo-accounts code { color:var(--accent-blue); }
        .captcha-question-row { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px; }
        .captcha-refresh { border:1px solid var(--border-color);border-radius:8px;background:var(--bg-surface);color:var(--text-primary);padding:6px 9px;cursor:pointer; }
    </style>
<link rel="apple-touch-icon" href="/images/aria-app-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#101418"><link rel="stylesheet" href="/css/platform.css"><link rel="stylesheet" href="/css/control-center.css"><link rel="stylesheet" href="/css/storefront.css"><script src="/js/company-entry.js" defer></script></head>
<body>
<div class="bg-mesh"></div>

<div class="auth-container">
    <div class="glass-card auth-card">
        <h1 style="text-align: center; margin-bottom: 30px;">◆ <span class="gradient-text">ARIA</span>Shop</h1>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')" data-copy="text.63f5c2c2f95afc">Вход</button>
            <button class="tab-btn" id="register-tab" hidden onclick="switchTab('register')" data-copy="text.9d91b7f27006ee">Регистрация</button>
        </div>

        <p id="company-login-note" hidden data-copy="text.3c22c23d5bef27">Закрытый кабинет компании. Доступ предоставляет владелец; регистрация покупателей здесь недоступна.</p>
        <!-- Форма входа -->
        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
            <div id="login-error" class="error-message" role="alert"></div>
            <label class="auth-label" for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Email" required maxlength="255" autocomplete="username">
            <label class="auth-label" for="login-password" data-copy="text.cb1a2074b3a027">Пароль</label>
            <input type="password" id="login-password" placeholder="Пароль" required maxlength="72" autocomplete="current-password" data-copy-placeholder="text.cb1a2074b3a027">
            <button type="submit" class="btn-glow" style="width: 100%;" data-copy="text.8fc9ab2eeb38ad">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
            <div id="register-error" class="error-message" role="alert"></div>
            <label class="auth-label" for="register-fullName" data-copy="text.bd391c57b08d97">ФИО</label>
            <input type="text" id="register-fullName" placeholder="ФИО" required maxlength="255" autocomplete="name" data-copy-placeholder="text.bd391c57b08d97">
            <label class="auth-label" for="register-email">Email</label>
            <input type="email" id="register-email" placeholder="Email" required maxlength="255" autocomplete="email">
            <label class="auth-label" for="register-password" data-copy="text.cb1a2074b3a027">Пароль</label>
            <input type="password" id="register-password" placeholder="Пароль — от 12 символов" required minlength="12" maxlength="72" autocomplete="new-password" data-copy-placeholder="text.fa5754b25da596">

            <!-- Honeypot field (скрыт от людей, но боты его заполнят) -->
            <input type="text" name="website" style="display: none;" tabindex="-1" autocomplete="off">

            <!-- Капча -->
            <div id="captcha-container" style="margin-bottom: 16px;">
                <input type="text" id="captcha-answer" inputmode="numeric" autocomplete="off" required placeholder="Ответ на вопрос" aria-label="Ответ на проверочный пример" style="width: 100%; padding: 14px 16px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-size: 15px; box-sizing: border-box;" data-copy-placeholder="text.3813f004ebf692" data-copy-aria-label="text.9ae0b5ee1ce4e6">
                <div class="captcha-question-row"><div id="captcha-question" aria-live="polite" style="font-size: 13px; color: var(--text-muted);" data-copy="text.40e9a4a31bf405">Загрузка капчи...</div><button id="captcha-refresh" class="captcha-refresh" type="button" onclick="window.loadRegisterCaptcha()" aria-label="Обновить пример" data-copy-aria-label="text.059fb8349835ae">↻</button></div>
            </div>
            <input type="hidden" id="captcha-id">

            <button type="submit" class="btn-glow" style="width: 100%;" data-copy="text.6629491d4d2233">Зарегистрироваться</button>
        </form>

        <div class="guest-link" data-public-store-link>
            <a href="/index.html" data-copy="text.ced92c68f31d22">Продолжить без входа — витрина открыта</a>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/login-page.js"></script>
<script src="/js/pwa.js"></script></body>
</html>
