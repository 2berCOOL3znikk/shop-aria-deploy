<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Shop — Вход</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            box-sizing: border-box;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .error-message {
            color: var(--accent-red);
            font-size: 14px;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .guest-link {
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .guest-link a {
            color: var(--accent-blue);
            text-decoration: none;
        }
        .demo-accounts { margin-top:22px;padding:15px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-surface);font-size:13px;line-height:1.7; }
        .demo-accounts h2 { margin:0 0 7px;font-size:14px;color:var(--text-primary); }
        .demo-accounts p { margin:3px 0;color:var(--text-secondary); }
        .demo-accounts code { color:var(--accent-blue); }
        .captcha-question-row { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px; }
        .captcha-refresh { border:1px solid var(--border-color);border-radius:8px;background:var(--bg-surface);color:var(--text-primary);padding:6px 9px;cursor:pointer; }
    </style>
<link rel="apple-touch-icon" href="/images/aria-app-192.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#101418"><link rel="stylesheet" href="/css/platform.css"></head>
<body>
<div class="bg-mesh"></div>

<div class="auth-container">
    <div class="glass-card auth-card">
        <h1 style="text-align: center; margin-bottom: 30px;">◆ <span class="gradient-text">ARIA</span>Shop</h1>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
            <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
            <div id="login-error" class="error-message"></div>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Пароль" required>
            <button type="submit" class="btn-glow" style="width: 100%;">Войти</button>
        </form>

        <!-- Форма регистрации -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
            <div id="register-error" class="error-message"></div>
            <input type="text" id="register-fullName" placeholder="ФИО" required>
            <input type="email" id="register-email" placeholder="Email" required>
            <input type="password" id="register-password" placeholder="Пароль — от 12 символов" required minlength="12" maxlength="72" autocomplete="new-password">

            <!-- Honeypot field (скрыт от людей, но боты его заполнят) -->
            <input type="text" name="website" style="display: none;" tabindex="-1" autocomplete="off">

            <!-- Капча -->
            <div id="captcha-container" style="margin-bottom: 16px;">
                <input type="text" id="captcha-answer" inputmode="numeric" autocomplete="off" required placeholder="Ответ на вопрос" aria-label="Ответ на проверочный пример" style="width: 100%; padding: 14px 16px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-size: 15px; box-sizing: border-box;">
                <div class="captcha-question-row"><div id="captcha-question" aria-live="polite" style="font-size: 13px; color: var(--text-muted);">Загрузка капчи...</div><button id="captcha-refresh" class="captcha-refresh" type="button" onclick="window.loadRegisterCaptcha()" aria-label="Обновить пример">↻</button></div>
            </div>
            <input type="hidden" id="captcha-id">

            <button type="submit" class="btn-glow" style="width: 100%;">Зарегистрироваться</button>
        </form>

        <div class="guest-link">
            <a href="/index.html">Продолжить без входа — витрина открыта</a>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

        if (tab === 'login') {
            document.querySelector('.tab-btn:first-child').classList.add('active');
            document.getElementById('login-form').classList.add('active');
        } else {
            document.querySelector('.tab-btn:last-child').classList.add('active');
            document.getElementById('register-form').classList.add('active');
            window.loadRegisterCaptcha();
        }
    }

    window.loadRegisterCaptcha = async function () {
        const question = document.getElementById('captcha-question');
        const id = document.getElementById('captcha-id');
        const answer = document.getElementById('captcha-answer');
        question.textContent = 'Загружаем проверочный пример…';
        id.value = '';
        answer.value = '';
        try {
            const response = await fetch('/api/auth/captcha', { cache: 'no-store' });
            if (!response.ok) throw new Error('Капча временно недоступна');
            const challenge = await response.json();
            id.value = challenge.id || '';
            question.textContent = challenge.question || 'Нажмите ↻, чтобы получить новый пример';
            if (!id.value) throw new Error('Сервер не выдал проверочный пример');
        } catch (error) {
            question.textContent = error.message || 'Не удалось загрузить капчу';
        }
    };

    async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('aria_token', data.token);
                localStorage.setItem('aria_role', data.role);
                localStorage.setItem('aria_email', data.email);

                const next = localStorage.getItem('aria_next');
                localStorage.removeItem('aria_next');
                location.href = safeNext(next, data.role);
            } else if (res.status === 401) {
                errorDiv.textContent = 'Неверный email или пароль';
                errorDiv.classList.add('show');
            } else {
                const err = await res.json();
                errorDiv.textContent = err.error || err.message || 'Ошибка входа';
                errorDiv.classList.add('show');
            }
        } catch (e) {
            errorDiv.textContent = 'Ошибка соединения с сервером';
            errorDiv.classList.add('show');
        }
    }

    async function handleRegister(event) {
        event.preventDefault();
        const fullName = document.getElementById('register-fullName').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const errorDiv = document.getElementById('register-error');
        const captchaId = document.getElementById('captcha-id').value.trim();
        const captchaAnswer = document.getElementById('captcha-answer').value.trim();
        const website = document.querySelector('#register-form [name="website"]').value.trim();

        if (!captchaId || !captchaAnswer) {
            errorDiv.textContent = 'Загрузите пример и введите ответ на капчу';
            errorDiv.classList.add('show');
            if (!captchaId) window.loadRegisterCaptcha();
            return;
        }
        errorDiv.classList.remove('show');

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, fullName, website, captchaId, captchaAnswer })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('aria_token', data.token);
                localStorage.setItem('aria_role', data.role);
                localStorage.setItem('aria_email', data.email);

                const next = localStorage.getItem('aria_next');
                localStorage.removeItem('aria_next');
                location.href = safeNext(next, data.role);
            } else {
                const err = await res.json().catch(() => ({}));
                errorDiv.textContent = err.error || err.message || 'Ошибка регистрации';
                errorDiv.classList.add('show');
                window.loadRegisterCaptcha();
            }
        } catch (e) {
            errorDiv.textContent = 'Ошибка соединения с сервером';
            errorDiv.classList.add('show');
            window.loadRegisterCaptcha();
        }
    }

    function safeNext(next, role) {
        if (role === 'ADMIN') return next && next.startsWith('/') && !next.startsWith('//') ? next : '/control.html';
        if (role === 'ORG') return next === '/social.html' ? next : '/social.html';
        return next && next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/admin') ? next : '/index.html';
    }

    // Сохраняем next-параметр при загрузке
    const params = new URLSearchParams(location.search);
    if (params.get('next')) {
        localStorage.setItem('aria_next', params.get('next'));
    }
    if (localStorage.getItem('aria_role') === 'ADMIN') location.replace('/control.html');
    else if (localStorage.getItem('aria_role') === 'ORG') location.replace('/social.html');
    window.loadRegisterCaptcha();
</script>
<script src="/js/pwa.js"></script></body>
</html>
