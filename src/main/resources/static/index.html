<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Shop — Каталог</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body>
<div class="bg-mesh"></div>

<nav class="nav-glass">
    <a href="/home.html" class="logo-new">◆ <span class="gradient-text">ARIA</span>Shop</a>
    <div class="nav-links">
        <a href="/index.html" class="active" data-i18n="nav.catalog">Каталог</a>
        <a href="/social.html" data-i18n="nav.social">Соц. полка</a>
        <a href="/cart.html" data-i18n="nav.cart">Корзина 🛒 <span id="cart-count" class="cart-badge">0</span></a>
        <a href="/profile.html" data-i18n="nav.profile">Профиль</a>
        <span id="auth-nav"></span>
        <button id="theme-toggle-btn" onclick="ariaTheme.toggleTheme()" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;font-size:18px;padding:0 8px;" title="Toggle theme">☀</button>
        <button id="lang-toggle-btn" onclick="ariaI18n.cycleLang()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px;">RU</button>
    </div>
</nav>

<main class="container" style="max-width:1200px;margin:40px auto;padding:0 20px;">
    <div style="display:flex;gap:15px;margin-bottom:30px;flex-wrap:wrap;">
        <input type="text" id="search" data-i18n-placeholder="catalog.search" placeholder=" Поиск товаров..." style="flex:1;min-width:200px;padding:12px 16px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:15px;">
        <select id="category" style="padding:12px 16px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:15px;">
            <option value="" data-i18n="catalog.category">Все категории</option>
            <option value="Продукты">Продукты</option>
            <option value="Электроника">Электроника</option>
            <option value="Дом/текстиль">Дом/Текстиль</option>
            <option value="Промо">Промо</option>
        </select>
        <select id="sort" style="padding:12px 16px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:15px;">
            <option value="default" data-i18n="catalog.sort">По умолчанию</option>
            <option value="price-asc" data-i18n="catalog.sortPriceAsc">Цена: ↓ Дешевле</option>
            <option value="price-desc" data-i18n="catalog.sortPriceDesc">Цена: ↑ Дороже</option>
            <option value="popular" data-i18n="catalog.sortPopular">Популярные</option>
        </select>
    </div>

    <div id="products" class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;">
        <p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">Загрузка товаров...</p>
    </div>
</main>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script>
    const state = { products: [], favoriteIds: new Set(), cartCount: 0 };

    function showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.innerHTML = '<span class="toast-icon">' + (type === 'error' ? '❌' : '✅') + '</span><span class="toast-message">' + msg + '</span>';
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function updateAuthNav() {
        const authNav = document.getElementById('auth-nav');
        if (ariaAuth.isLoggedIn()) {
            authNav.innerHTML = '<span style="font-size:14px;color:var(--text-muted);margin-right:15px;">' + ariaAuth.getUserEmail() + '</span>' +
                '<button onclick="ariaAuth.logout()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;">Выйти</button>';
        } else {
            authNav.innerHTML = '<a href="/login.html" style="color:var(--accent-blue);text-decoration:none;font-size:14px;">Войти</a>';
        }
    }

    async function loadCartCount() {
        try {
            const res = await ariaAuth.authFetch('/api/cart/total');
            const data = await res.json();
            state.cartCount = data.itemCount || 0;
            document.getElementById('cart-count').textContent = state.cartCount;
        } catch(e) { console.error(e); }
    }

    async function loadFavorites() {
        try {
            const res = await ariaAuth.authFetch('/api/favorites/ids');
            const data = await res.json();
            state.favoriteIds = new Set(data.ids || []);
        } catch(e) { console.error(e); }
    }

    async function toggleFavorite(productId, btn) {
        if (!ariaAuth.requireLogin()) return;
        try {
            const res = await ariaAuth.authFetch('/api/favorites/' + productId, { method: 'POST' });
            const data = await res.json();
            if (data.isFavorite) {
                state.favoriteIds.add(productId);
                btn.textContent = '❤️';
                showToast('Добавлено в избранное');
            } else {
                state.favoriteIds.delete(productId);
                btn.textContent = '🤍';
                showToast('Удалено из избранного');
            }
        } catch(e) { showToast('Ошибка', 'error'); }
    }

    async function addToCart(productId) {
        if (!ariaAuth.requireLogin()) return;
        try {
            await ariaAuth.authFetch('/api/cart/add?productId=' + productId + '&qty=1', { method: 'POST' });
            await loadCartCount();
            showToast('Товар добавлен в корзину');
        } catch(e) { showToast('Ошибка добавления', 'error'); }
    }

    function renderProducts(products) {
        const grid = document.getElementById('products');
        if (products.length === 0) {
            grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);" data-i18n="catalog.noProducts">Товары не найдены</p>';
            return;
        }
        grid.innerHTML = products.map(p => {
            const isFav = state.favoriteIds.has(p.id);
            return '<div class="glass-card animate-in" style="padding:0;overflow:hidden;">' +
                '<img src="https://placehold.co/400x300/1e293b/3b82f6?text=' + encodeURIComponent(p.name) + '" alt="' + p.name +  '" style="width:100%;height:200px;object-fit:cover;">' +
                '<div style="padding:16px;">' +
                '<div style="display:flex;justify-content:space-between;align-items:start;">' +
                '<h3 style="margin:0;font-size:16px;">' + p.name + '</h3>' +
                '<button class="btn-icon" onclick="toggleFavorite(' + p.id + ',this)" style="background:transparent;border:none;cursor:pointer;font-size:20px;">' + (isFav ? '❤️' : '🤍') + '</button>' +
                '</div>' +
                '<div style="color:var(--text-muted);font-size:12px;margin:8px 0;">SKU: ' + p.sku + ' · ' + (p.category || '') + '</div>' +
                '<div style="font-size:22px;font-weight:700;color:var(--accent-blue);margin:12px 0;">' + p.unitPrice + ' ₽</div>' +
                '<div style="display:flex;gap:8px;">' +
                '<button class="btn-glow" onclick="addToCart(' + p.id + ')" style="flex:1;" data-i18n="catalog.addToCart">В корзину</button>' +
                '<a href="/product.html?id=' + p.id + '" class="btn-outline" style="text-decoration:none;" data-i18n="catalog.details">Подробнее</a>' +
                '</div>' +
                '</div>' +
                '</div>';
        }).join('');
    }

    function filterAndSort() {
        const search = document.getElementById('search').value.toLowerCase();
        const category = document.getElementById('category').value;
        const sort = document.getElementById('sort').value;

        let filtered = state.products.filter(p => {
            const matchSearch = p.name.toLowerCase().includes(search) || p.sku.toLowerCase().includes(search);
            const matchCategory = !category || p.category === category;
            return matchSearch && matchCategory;
        });

        if (sort === 'price-asc') filtered.sort((a, b) => a.unitPrice - b.unitPrice);
        else if (sort === 'price-desc') filtered.sort((a, b) => b.unitPrice - a.unitPrice);
        else if (sort === 'popular') filtered.sort((a, b) => b.salesLast30Days - a.salesLast30Days);

        renderProducts(filtered);
    }

    async function init() {
        updateAuthNav();
        ariaTheme.initTheme();
        ariaI18n.initI18n();
        await Promise.all([loadFavorites(), loadCartCount()]);
        try {
            const res = await fetch('/api/products/store');
            state.products = await res.json();
            filterAndSort();
        } catch(e) {
            showToast(ariaI18n.t('toast.error'), 'error');
        }

        document.getElementById('search').addEventListener('input', filterAndSort);
        document.getElementById('category').addEventListener('change', filterAndSort);
        document.getElementById('sort').addEventListener('change', filterAndSort);
    }

    init();
</script>
</body>
</html>
