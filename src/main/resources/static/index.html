<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA Shop — Каталог</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/theme.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/shell.js"></script>
</head>
<body>
<div class="bg-mesh"></div>

<nav class="nav-glass">
    <a href="/home.html" class="logo-new">◆ <span class="gradient-text">ARIA</span>Shop</a>
    <div class="nav-links">
        <a href="/index.html" class="active" data-i18n="nav.catalog">Каталог</a>
        <a href="/social.html" data-i18n="nav.social">Соц. полка</a>
        <a href="/profile.html#favorites-list" aria-label="Избранное">♡ Избранное</a>
        <a href="/cart.html" data-i18n="nav.cart">Корзина 🛒 <span id="cart-count" class="cart-badge">0</span></a>
        <a href="/profile.html" data-i18n="nav.profile">Профиль</a>
        <span id="auth-nav"></span>
        <button id="theme-toggle-btn" onclick="ariaTheme.toggleTheme()" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;font-size:18px;padding:0 8px;" title="Toggle theme">☀</button>
        <button id="lang-toggle-btn" onclick="ariaI18n.cycleLang()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);cursor:pointer;font-size:12px;padding:4px 8px;border-radius:6px;">RU</button>
    </div>

</nav>

<section class="catalog-intro glass-card" aria-label="Информация о каталоге">

    <a href="/social.html">Помощь фондам и приютам <span aria-hidden="true">→</span></a>
</section>

<main class="container" style="max-width:1400px;margin:40px auto;padding:0 20px;">
    <!-- Impact Hero Strip - Donation Dashboard Style -->
    <div class="impact-hero">
        <div class="impact-stat">
            <div class="impact-stat-value" id="impact-saved">0</div>
            <div class="impact-stat-label">Спасено от списания</div>
        </div>
        <div class="impact-stat">
            <div class="impact-stat-value" id="impact-social">0</div>
            <div class="impact-stat-label">Товаров в соц-разделе</div>
        </div>
        <div class="impact-stat">
            <div class="impact-stat-value" id="impact-active">0</div>
            <div class="impact-stat-label">Товаров в каталоге</div>
        </div>
    </div>

    <!-- Sticky Search Bar -->
    <div class="sticky-search-container">
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <input type="text" id="search" data-i18n-placeholder="catalog.search" placeholder=" Поиск товаров..." style="flex:1;min-width:200px;padding:14px 18px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:12px;color:var(--text-primary);font-size:15px;">
            <select id="sort" style="padding:14px 18px;background:var(--bg-surface);border:1px solid var(--border-color);border-radius:12px;color:var(--text-primary);font-size:15px;">
                <option value="default" data-i18n="catalog.sort">По умолчанию</option>
                <option value="price-asc" data-i18n="catalog.sortPriceAsc">Цена: ↓ Дешевле</option>
                <option value="price-desc" data-i18n="catalog.sortPriceDesc">Цена: ↑ Дороже</option>
                <option value="popular" data-i18n="catalog.sortPopular">Популярные</option>
            </select>
        </div>
    </div>

    <!-- Category Chips -->
    <div class="category-chips" id="category-chips">
        <button class="category-chip active" data-category="" data-i18n="catalog.category">Все категории</button>
    </div>

    <!-- Product Grid -->
    <div id="products" class="responsive-grid">
        <!-- Skeleton placeholders shown first -->
        <div class="product-card skeleton" style="height:400px;"></div>
        <div class="product-card skeleton" style="height:400px;"></div>
        <div class="product-card skeleton" style="height:400px;"></div>
        <div class="product-card skeleton" style="height:400px;"></div>
        <div class="product-card skeleton" style="height:400px;"></div>
        <div class="product-card skeleton" style="height:400px;"></div>
    </div>
</main>

<div class="toast-container" id="toast-container"></div>

<script src="/js/auth.js"></script>
<script src="/js/money.js"></script>
<script>
    const state = { products: [], favoriteIds: new Set(), cartCount: 0, allCategories: new Set() };

    function showToast(message, type = 'success') {
        message = String(message ?? '');

        // Автоматически различаем добавление/удаление даже если вызвали одним типом
        if (!type || type === 'success') {
            if (/удал|убран|removed|dismiss|снят|отмен|очищ/i.test(message)) type = 'remove';
            else if (/ошибк|error|не удалось|запрещ|доступ|403|401|500|пуст/i.test(message)) type = 'error';
            else if (/важно|вниман|warning|осторож|критич|срочн/i.test(message)) type = 'warning';
            else if (/инфо|info|справк|обнов/i.test(message)) type = 'info';
            else type = 'success';
        }

        const ICON = { success: "✓", info: "i", warning: "!", error: "✕", remove: "−" };
        const container = document.getElementById('toast-container') ||
            document.body.appendChild(Object.assign(document.createElement('div'), { id: 'toast-container', className: 'toast-container' }));

        const el = document.createElement('div');
        el.className = 'toast ' + type;
        el.innerHTML = '<span class="toast-icon">' + (ICON[type] || '•') + '</span><span class="toast-message"></span>';
        el.querySelector('.toast-message').textContent = message;
        container.appendChild(el);

        requestAnimationFrame(() => el.classList.add('show'));           // плавный вход

        let killed = false;
        const kill = () => {
            if (killed) return;
            killed = true;
            el.classList.remove('show');
            el.classList.add('out');                                     // плавный уход
            setTimeout(() => el.remove(), 340);
        };

        let timer = setTimeout(kill, 5200);                              // ~5 секунд — успеваешь прочитать
        el.addEventListener('mouseenter', () => clearTimeout(timer));   // пауза под курсором
        el.addEventListener('mouseleave', () => { timer = setTimeout(kill, 1400); });

        return el;
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function updateAuthNav() {
        const authNav = document.getElementById('auth-nav');
        if (ariaAuth.isLoggedIn()) {
            authNav.innerHTML = '<span style="font-size:14px;color:var(--text-muted);margin-right:15px;">' + ariaAuth.getUserEmail() + '</span>' +
                '<button onclick="ariaAuth.logout()" style="background:transparent;border:1px solid var(--border-color);color:var(--text-primary);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;">Выйти</button>';
        } else {
            authNav.innerHTML = '<a href="/login.html" style="color:var(--accent-blue);text-decoration:none;font-size:14px;">Войти</a>';
        }
    }

    async function loadCartCount() {
        if (!ariaAuth.isLoggedIn()) return;
        try {
            const res = await ariaAuth.authFetch('/api/cart/total');
            const data = await res.json();
            state.cartCount = data.itemCount || 0;
            document.getElementById('cart-count').textContent = state.cartCount;
        } catch(e) { console.error(e); }
    }

    async function loadFavorites() {
        if (!ariaAuth.isLoggedIn()) { state.favoriteIds.clear(); return; }
        try {
            const res = await ariaAuth.authFetch('/api/favorites/ids');
            const data = await res.json();
            state.favoriteIds = new Set(data.ids || []);
        } catch(e) { console.error(e); }
    }

    async function toggleFavorite(productId, btn) {
        if (!ariaAuth.requireLogin()) return;
        try {
            const res = await ariaAuth.authFetch('/api/favorites/' + productId, { method: 'POST' });
            const data = await res.json();
            if (data.isFavorite) {
                state.favoriteIds.add(productId);
                btn.innerHTML = '♥';
                btn.classList.add('is-active', 'pop');
                setTimeout(() => btn.classList.remove('pop'), 340);
                showToast('Добавлено в избранное');
            } else {
                state.favoriteIds.delete(productId);
                btn.innerHTML = '♡';
                btn.classList.remove('is-active');
                btn.classList.add('pop');
                setTimeout(() => btn.classList.remove('pop'), 340);
                showToast('Удалено из избранного');
            }
        } catch(e) { showToast('Ошибка', 'error'); }
    }

    async function addToCart(productId) {
        if (!ariaAuth.requireLogin()) return;
        try {
            await ariaAuth.authFetch('/api/cart/add?productId=' + productId + '&qty=1', { method: 'POST' });
            await loadCartCount();
            showToast('Товар добавлен в корзину');
        } catch(e) { showToast('Ошибка добавления', 'error'); }
    }

    // Calculate expiry level pill
    function getExpiryLevel(expiryDate) {
        if (!expiryDate) return null;
        const today = new Date();
        const expiry = new Date(expiryDate);
        const daysLeft = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

        if (daysLeft < 0) return { class: 'expiry-expired', text: 'Просрочен' };
        if (daysLeft <= 7) return { class: 'expiry-critical', text: 'Критично' };
        if (daysLeft <= 30) return { class: 'expiry-warning', text: 'Внимание' };
        return { class: 'expiry-good', text: 'Активен' };
    }

    // Calculate discount percentage
    function getDiscountBadge(marketDealPercent) {
        if (!marketDealPercent || marketDealPercent < 5) return null;
        return '-' + marketDealPercent + '% к рынку';
    }

    // Animate number count-up
    function animateNumber(element, target, duration = 1000) {
        const start = parseInt(element.textContent) || 0;
        const increment = (target - start) / (duration / 16);
        let current = start;

        const timer = setInterval(() => {
            current += increment;
            if ((increment > 0 && current >= target) || (increment < 0 && current <= target)) {
                element.textContent = target;
                clearInterval(timer);
            } else {
                element.textContent = Math.floor(current);
            }
        }, 16);
    }

    function renderProducts(products) {
        const grid = document.getElementById('products');
        if (products.length === 0) {
            grid.style.opacity = '0';
            setTimeout(() => {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px;" data-i18n="catalog.noProducts">Товары не найдены</p>';
                grid.style.transition = 'opacity .25s ease';
                grid.style.opacity = '1';
            }, 150);
            return;
            grid.querySelectorAll('.aria-favorite-button').forEach(btn => {
                const id = Number(btn.dataset.id);
                window.bindFavoriteButton(btn, id, state.favoriteIds.has(id));
            });
        }

        grid.style.transition = 'opacity .18s ease';
        grid.style.opacity = '0.25';                       // мягкий уход старой сетки
        const html = products.map(p => {

            // Приоритет: ТВОЙ локальный файл (по SKU) > поле базы > общая заглушка.
            // Если файла нет — браузер получит 404 и onerror ниже тихо переключит на следующий источник.
            const sku = String(p.sku || '').trim();
            const sources = [];
            if (sku) sources.push('/images/products/' + sku + '.jpg');
            if (p.imageUrl) sources.push(p.imageUrl);
            sources.push('/images/product-generic.svg');
            const imageUrl = sources[0];
            const chainAttr = JSON.stringify(sources.slice(1)).replace(/'/g, "&#39;");

            return '<div class="product-card" style="position:relative;">' +
                (discountBadge ? '<span class="discount-badge">' + discountBadge + '</span>' : '') +
                '<a href="/product.html?id=' + p.id + '" aria-label="Подробнее о товаре ' + escapeHtml(p.name) + '">' +
                '<img src="' + imageUrl + '" data-chain=\'' + chainAttr + '\' data-ci="0" ' +
                'onerror="(function(i){var c=JSON.parse(i.getAttribute(\'data-chain\')||\'[]\'),n=(+i.dataset.ci)|0;if(n<c.length){i.dataset.ci=n+1;i.src=c[n];}else{i.onerror=null;}})(this)" ' +
                'alt="' + escapeHtml(p.name) + '" class="product-card-image">' +
                '</a>' +
                '<div class="product-card-content">' +
                '<div class="product-card-category">' + escapeHtml(p.category || 'Без категории') + '</div>' +
                '<a class="product-card-name" href="/product.html?id=' + p.id + '">' + escapeHtml(p.name) + '</a>' +
                (p.brand ? '<div class="product-card-brand">' + escapeHtml(p.brand) + '</div>' : '') +
                (p.description ? '<p class="product-card-description">' + escapeHtml(p.description) + '</p>' : '') +
                '<div class="product-card-stock">В наличии: ' + (p.quantityOnHand || 0) + ' шт.</div>' +
                (expiryLevel ? '<span class="expiry-pill ' + expiryLevel.class + '">' + expiryLevel.text + '</span>' : '') +
                (p.discountPercent > 0 ?
                    '<div class="product-card-price">' + ariaMoney.format(p.displayPrice) + ' <span style="text-decoration:line-through;color:var(--text-muted);font-size:14px;font-weight:400;">' + ariaMoney.format(p.unitPrice) + '</span></div>' :
                    '<div class="product-card-price">' + ariaMoney.format(p.unitPrice) + '</div>') +
                '<div class="product-card-actions">' +
                '<button class="btn-add-cart" onclick="addToCart(' + p.id + ')">В корзину</button>' +
                '<button class="aria-favorite-button' + (isFav ? ' is-active' : '') + '" data-id="' + p.id + '">' + (isFav ? '♥' : '♡') + '</button>' +
                '</div>' +
                '</div>' +
                '</div>';
        }).join('');

        setTimeout(() => {
            grid.innerHTML = html;                          // вставляем новую сетку
            grid.style.opacity = '1';                        // плавное появление
            // stagger по карточкам для эффекта «разлёта»
            Array.from(grid.children).forEach((el, i) => {
                el.style.animation = 'none';
                void el.offsetWidth;                         // форсируем reflow
                el.style.animation = 'cardIn .45s cubic-bezier(.22,.61,.36,1) both';
                el.style.animationDelay = Math.min(i * 0.04, 0.4) + 's';
            });
        }, 180);
        // Привязываем лайки ко всем кнопкам
        grid.querySelectorAll('.aria-favorite-button').forEach(btn => {
            const id = Number(btn.dataset.id);
            window.bindFavoriteButton(btn, id, state.favoriteIds.has(id));
        });

    }
    function filterAndSort() {
        const search = document.getElementById('search').value.toLowerCase();
        const category = document.getElementById('category-chips').querySelector('.active').dataset.category;
        const sort = document.getElementById('sort').value;

        let filtered = state.products.filter(p => {
            const matchSearch = (p.name || '').toLowerCase().includes(search) || (p.sku || '').toLowerCase().includes(search) || (p.description || '').toLowerCase().includes(search);
            const matchCategory = !category || p.category === category;
            return matchSearch && matchCategory;
        });

        if (sort === 'price-asc') filtered.sort((a, b) => a.unitPrice - b.unitPrice);
        else if (sort === 'price-desc') filtered.sort((a, b) => b.unitPrice - a.unitPrice);
        else if (sort === 'popular') filtered.sort((a, b) => (b.popularityRank || 0) - (a.popularityRank || 0));

        renderProducts(filtered);
    }

    function updateCategoryChips() {
        const container = document.getElementById('category-chips');
        const categories = [''].concat(Array.from(state.allCategories).sort());

        container.innerHTML = categories.map(cat =>
            '<button class="category-chip' + (cat === '' ? ' active' : '') + '" data-category="' + cat + '">' +
            (cat === '' ? 'Все категории' : cat) +
            '</button>'
        ).join('');

        container.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                container.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                filterAndSort();
            });
        });
    }

    async function updateImpactStats() {
        try {
            const res = await fetch('/api/social/impact');
            const impact = await res.json();
            animateNumber(document.getElementById('impact-saved'), impact.claimedUnits || 0);
            animateNumber(document.getElementById('impact-social'), impact.openUnits || 0);
            animateNumber(document.getElementById('impact-active'), state.products.length);
        } catch(e) {
            animateNumber(document.getElementById('impact-active'), state.products.length);
        }
    }

    async function init() {
        updateAuthNav();
        ariaTheme.initTheme();
        ariaI18n.initI18n();
        await Promise.all([loadFavorites(), loadCartCount()]);

        try {
            const res = await fetch('/api/products/store');
            state.products = await res.json();

            // Extract unique categories
            state.products.forEach(p => {
                if (p.category) state.allCategories.add(p.category);
            });

            updateCategoryChips();
            await updateImpactStats();
            filterAndSort();
        } catch(e) {
            showToast(ariaI18n.t('toast.error'), 'error');
        }

        document.getElementById('search').addEventListener('input', filterAndSort);
        document.getElementById('sort').addEventListener('change', filterAndSort);
    }

    init();
</script>
    <script src="/js/index-mvp.js"></script>
</body>
</html>
