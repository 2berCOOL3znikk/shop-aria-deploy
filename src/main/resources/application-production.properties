# Activate with postgres,production. ProductionConfiguration rejects unsafe overrides.
aria.seed-demo-users=false
aria.seed-demo-catalog=false
aria.demo-market-enabled=false
aria.reset-data-on-start=false
aria.admin.email=${ARIA_ADMIN_EMAIL:}
aria.admin.password=${ARIA_ADMIN_PASSWORD:}
jwt.secret=${ARIA_JWT_SECRET:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=600000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoint.health.show-details=never
logging.level.root=WARN
logging.level.com.aria=INFO
