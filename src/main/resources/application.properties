# --- НАСТРОЙКИ БАЗЫ ДАННЫХ H2 (Демо-профиль) ---
# Local H2 persists data. Use PostgreSQL profile for the capstone / deployment.
spring.datasource.url=jdbc:h2:file:${ARIA_LOCAL_DB:./data/aria};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# One isolated process/database per company. Browser input never selects the tenant.
aria.organization.key=${ARIA_ORGANIZATION_KEY:demo}

# --- КОНСОЛЬ H2 (для просмотра базы в браузере) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- ЛОГИРОВАНИЕ ---
logging.level.root=WARN
logging.level.com.aria=INFO

aria.reset-data-on-start=${ARIA_RESET_DATA_ON_START:false}
aria.admin.email=${ARIA_ADMIN_EMAIL:admin@aria.shop}
aria.admin.password=${ARIA_ADMIN_PASSWORD:admin123}
aria.seed-demo-users=${ARIA_SEED_DEMO_USERS:true}
aria.seed-demo-catalog=${ARIA_SEED_DEMO_CATALOG:true}
aria.demo-market-enabled=${ARIA_DEMO_MARKET_ENABLED:false}
aria.demo-catalog-import-enabled=${ARIA_DEMO_CATALOG_IMPORT_ENABLED:false}
jwt.secret=${ARIA_JWT_SECRET:aria-local-development-token-signing-key-change-before-any-public-host}
management.endpoints.web.exposure.include=health
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=${PORT:8080}
# Compress public text assets. JSON APIs and binary uploads deliberately keep their own representation.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,image/svg+xml
spring.config.import=optional:file:.env.openrouter.local[.properties],optional:file:.env.integrations.local[.properties]
aria.integrations.encryption-key=${ARIA_INTEGRATION_ENCRYPTION_KEY:}
aria.integrations.allowed-hosts=${ARIA_WOO_ALLOWED_HOSTS:}
aria.company-signup.enabled=${ARIA_COMPANY_SIGNUP_ENABLED:false}
aria.company-activation.enabled=${ARIA_COMPANY_ACTIVATION_ENABLED:false}
aria.company-activation.request-id=${ARIA_WORKSPACE_REQUEST_ID:}
aria.company-activation.access-hash=${ARIA_WORKSPACE_ACCESS_HASH:}
aria.company-activation.probe-key=${ARIA_WORKSPACE_PROBE_KEY:}
aria.company-activation.deadline=${ARIA_WORKSPACE_DEADLINE:}
