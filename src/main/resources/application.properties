# --- НАСТРОЙКИ БАЗЫ ДАННЫХ H2 (Демо-профиль) ---
# H2 in-memory: база чистая при каждом старте, висячих FK не бывает
spring.datasource.url=jdbc:h2:mem:aria;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Per-run clean rebuild of schema (demo reproducibility)
spring.jpa.hibernate.ddl-auto=create-drop

# Явную строку hibernate.dialect для H2 УДАЛИ (Hibernate сам определит — это убирает WARN HHH90000025)
# spring.jpa.properties.hibernate.dialect=...H2Dialect   <-- закомментируй или удали эту строку

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- КОНСОЛЬ H2 (для просмотра базы в браузере) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- ЛОГИРОВАНИЕ ---
logging.level.root=WARN
logging.level.com.aria=INFO

# Пересоздавать товары при каждом запуске (true = да, false = нет)
aria.reset-data-on-start=true