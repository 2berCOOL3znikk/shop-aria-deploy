# --- НАСТРОЙКИ БАЗЫ ДАННЫХ H2 (Демо-профиль) ---
# H2 для быстрого локального запуска. Для сохранения между перезапусками используйте Compose/PostgreSQL.
spring.datasource.url=jdbc:h2:mem:aria;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- КОНСОЛЬ H2 (для просмотра базы в браузере) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- ЛОГИРОВАНИЕ ---
logging.level.root=WARN
logging.level.com.aria=INFO

aria.reset-data-on-start=${ARIA_RESET_DATA_ON_START:false}
aria.admin.email=${ARIA_ADMIN_EMAIL:admin@aria.shop}
aria.admin.password=${ARIA_ADMIN_PASSWORD:admin123}
aria.seed-demo-users=${ARIA_SEED_DEMO_USERS:true}
jwt.secret=${ARIA_JWT_SECRET:aria-local-development-token-signing-key-change-before-any-public-host}
management.endpoints.web.exposure.include=health
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
