# Activate after postgres,production: SPRING_PROFILES_ACTIVE=postgres,production,free
# Release idle connections so serverless PostgreSQL can suspend compute without losing storage.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# Process probes must not wake the database on every Render health check.
management.health.db.enabled=false
# Availability and expiry are checked again during reads and every stock mutation.
aria.stock-refresh-enabled=false
aria.background-analysis-enabled=false
aria.smart-pricing.schedule-enabled=false
# Requests must use a free model and zero provider price limits.
aria.intelligence.external-enabled=true
aria.intelligence.free-only=true
