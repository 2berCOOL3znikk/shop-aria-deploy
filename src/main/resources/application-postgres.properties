# --- НАСТРОЙКИ БАЗЫ ДАННЫХ POSTGRESQL (Профиль: --spring.profiles.active=postgres) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aria}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- ЛОГИРОВАНИЕ ---
logging.level.root=WARN
logging.level.com.aria=INFO

# Пересоздавать товары при каждом запуске (true = да, false = нет)
aria.reset-data-on-start=true
