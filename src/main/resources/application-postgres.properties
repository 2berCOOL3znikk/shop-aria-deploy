# --- НАСТРОЙКИ БАЗЫ ДАННЫХ POSTGRESQL (Профиль: --spring.profiles.active=postgres) ---
spring.datasource.url=jdbc:${ARIA_DATABASE_URL:postgresql://localhost:5432/aria}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- ЛОГИРОВАНИЕ ---
logging.level.root=WARN
logging.level.com.aria=INFO

aria.reset-data-on-start=${ARIA_RESET_DATA_ON_START:false}
aria.admin.email=${ARIA_ADMIN_EMAIL:admin@aria.shop}
aria.admin.password=${ARIA_ADMIN_PASSWORD:}
aria.seed-demo-users=${ARIA_SEED_DEMO_USERS:false}
aria.seed-demo-catalog=${ARIA_SEED_DEMO_CATALOG:false}
aria.demo-market-enabled=${ARIA_DEMO_MARKET_ENABLED:false}
jwt.secret=${ARIA_JWT_SECRET:}
management.endpoints.web.exposure.include=health
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
