# Dedicated, initially empty company process. Never enable this profile on an existing company.
aria.saas.slot-enabled=true
aria.saas.gateway-enabled=false
aria.organization.key=${ARIA_WORKSPACE_BINDING:}
aria.saas.slot-key=${ARIA_WORKSPACE_BOOTSTRAP_KEY:}
aria.saas.slot-database-host=${ARIA_SLOT_DATABASE_HOST:}
spring.datasource.hikari.connection-init-sql=SELECT set_config('aria.workspace_slot_binding','${ARIA_WORKSPACE_BINDING:}',false)
aria.company-signup.enabled=false
aria.company-signup.intake-only=false
aria.manager.enabled=true
aria.manager.schedule-enabled=false
aria.intelligence.external-enabled=false
aria.store-sync.worker-enabled=true
aria.stock-refresh-enabled=false
aria.background-analysis-enabled=false
aria.smart-pricing.schedule-enabled=false
aria.connected-pricing.schedule-enabled=false
