<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARIA — проверка композиции</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f8;color:#202024;font:14px/1.55 system-ui,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:228px;padding:32px 20px;background:white;border-right:1px solid #e7e7ea}aside>b{font-size:25px;letter-spacing:-1px}aside p{color:#72727c;margin:24px 0;font-size:12px}nav{display:grid;gap:5px}nav a{padding:10px;border-radius:7px;text-decoration:none;color:#55555e}nav a:first-child{background:#eeeef0;color:#202024}main{margin-left:228px;max-width:1500px;padding:30px 42px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:36px}header strong{font-size:15px}small,.muted{color:#71717b}h1{font-size:32px;letter-spacing:-1px;line-height:1.2;margin:6px 0 14px}h2{font-size:18px;letter-spacing:-.4px;margin:0 0 9px}p{margin:8px 0 18px}a{color:inherit}.panel{background:white;border:1px solid #e5e5e9;border-radius:14px;padding:25px}.hero{background:#202024;color:white;min-height:270px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.hero p,.hero small{color:#b9b9c3}.primary{display:inline-flex;align-items:center;gap:20px;background:white;color:#202024;padding:11px 15px;border-radius:8px;font-weight:600;text-decoration:none;font-size:13px}.split{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e5e5e9;border-radius:13px;background:white;margin:22px 0}.stats>a{padding:22px;text-decoration:none}.stats b{display:block;font-size:26px;font-weight:600;letter-spacing:-.8px}.stats span{font-size:12px;color:#71717b}.row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #ededf0}.row:last-child{border:0}.row>b{margin-left:auto;font-size:22px;font-weight:500}.row a{font-size:12px;color:#676772}.number{width:29px;height:29px;border:1px solid #dedee5;border-radius:7px;display:grid;place-items:center;color:#72727c}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px}.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.lane{min-height:210px}.lane strong{font-size:32px;display:block;margin:24px 0 15px}.queue{margin:24px 0}.queue .row{padding:22px 3px}.end{font-size:11px;color:#7e7e88;margin-top:24px}.history .row{padding:12px 0}.history time{font-size:11px;color:#71717b;margin-left:auto}.empty{padding:25px 0;color:#71717b;font-size:13px}.tag{display:inline-flex;border:1px solid #e4e4e9;padding:4px 8px;border-radius:6px;font-size:11px}@media(max-width:850px){aside{position:static;width:auto;padding:18px 22px}aside p,nav{display:none}main{margin:0;padding:23px}.split{grid-template-columns:1fr}.stats,.lanes{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}header{margin-bottom:24px}.hero{min-height:250px}.panel{padding:21px}}
</style><aside><b>ARIA</b><p id="company"></p><nav><a href="/control.html#workspace">Главная</a><a href="/control.html#manager">ARIA AI</a><a href="/control.html#stores">Мои магазины</a><a href="/control.html#products">Товары</a><a href="/control.html#lots">Склад</a><a href="/control.html#smart">Цены</a><a href="/control.html#socialPlans">ARIA Impact</a></nav></aside><main id="main"></main><script>
const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const r=await fetch('/api/admin/control/workspace/overview',{headers:{Authorization:'Bearer '+localStorage.getItem('aria_token')}});if(!r.ok)throw Error('Не удалось получить данные');const d=await r.json();window.ariaConceptData=d;const variant=new URLSearchParams(location.search).get('concept')||'a',o=d.overview,t=d.today;document.getElementById('company').textContent=d.organization.name;
const first=d.stores.total===0&&o.products===0,hero=`<article class="panel hero"><small class="label">${first?'Первый шаг':'Рабочее пространство'}</small><h1>${first?'Подключите магазин.<br>Дальше поможет ARIA.':'Главное на сегодня'}</h1><p>${first?'Товары и заказы появятся из вашего магазина.<br>Доступы останутся под вашим контролем.':'Проверьте исключения и результаты разрешённых действий.'}</p><a class="primary" href="/control.html#${first?'stores':'manager'}">${first?'Подключить магазин':'Открыть ARIA AI'} <span>→</span></a></article>`;
const stats=`<div class="stats">${[['Продажи сегодня',Number(d.sales.revenueToday).toLocaleString('ru-KZ')+' ₸','orders'],['Товары',o.products,'products'],['Остаток',o.availableUnits,'lots'],['Магазины',d.stores.connected+d.stores.testConnected,'stores']].map(([label,v,route])=>`<a href="/control.html#${route}"><span>${label}</span><b>${v}</b></a>`).join('')}</div>`;
const tasks=`<article class="panel"><small class="label">Требует внимания</small><div class="row"><span>Заказы к отправке</span><b>${o.pendingOrders}</b></div><div class="row"><span>Партии с истёкшим сроком</span><b>${o.expiredLots}</b></div><div class="row"><span>Решения на проверку</span><b>${d.risks.pendingDecisions}</b></div><a href="/control.html#manager">Все ситуации →</a></article>`;
const history=`<article class="panel history"><h2>Последние действия</h2>${d.recent.length?d.recent.slice(0,3).map(e=>`<div class="row"><a href="/control.html#${e.section}">${escape(e.title)}</a><time>${new Date(e.at).toLocaleDateString('ru-KZ')}</time></div>`).join(''):'<p class="empty">История появится после первых действий.</p>'}</article>`;
const flow=`<div class="lanes">${[['Наблюдение',o.products,'products'],['Проверка срока',o.urgentLots,'lots'],['Решения',d.risks.pendingDecisions,'smart'],['Передача','—','socialPlans']].map(([label,n,route])=>`<article class="panel lane"><small>${label}</small><strong>${n}</strong><a href="/control.html#${route}">Открыть →</a></article>`).join('')}</div>`;
const ledger=`<article class="panel queue"><h2>Рабочая очередь</h2>${[[o.pendingOrders,'Подготовить заказы','orders'],[o.lowStock,'Проверить пополнение','products'],[o.urgentLots,'Проверить срок партий','lots'],[d.risks.pendingDecisions,'Рассмотреть цены','smart']].map(([n,label,route])=>`<div class="row"><span class="number">${n}</span><a href="/control.html#${route}">${label}</a><span class="muted">→</span></div>`).join('')}</article>`;
document.getElementById('main').innerHTML=`<header><strong>${variant==='a'?'A / Рабочий день':variant==='b'?'B / Путь товара':'C / Очередь исключений'}</strong><span class="tag">Данные компании · ${escape(d.date)}</span></header>`+(variant==='a'?`<div class="split">${hero}${tasks}</div>${stats}<div class="split"><article class="panel"><h2>Сегодня ARIA</h2><div class="row"><span>Решения модели</span><b>${t.aiDecisions}</b></div><div class="row"><span>Автоматические расчёты</span><b>${t.engineDecisions}</b></div><small>Показаны только сохранённые действия.</small></article>${history}</div>`:variant==='b'?`<h1>Путь товара под контролем.</h1><p class="muted">От поступления до подтверждённого результата.</p>${flow}<div class="split">${hero}${tasks}</div>${stats}`:`<h1>Сначала — важное.</h1><p class="muted">Одна очередь для решений, заказов и остатков.</p>${ledger}<div class="split">${tasks}${history}</div>${stats}`)+`<p class="end">Концепция на настоящем read-only API. «—» означает отсутствие показателя, а не нулевую передачу.</p>`;document.documentElement.dataset.ready='true';})().catch(()=>{document.getElementById('main').textContent='Данные не загружены. Войдите в учебную компанию.';document.documentElement.dataset.failed='true';});
</script></html>
