services:
  - type: web
    name: shop-aria
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,production,free
      - key: ARIA_DATABASE_URL
        sync: false # Direct Neon Free connection URL; no Render database is created.
      - key: ARIA_RESET_DATA_ON_START
        value: "false"
      - key: ARIA_SEED_DEMO_USERS
        value: "false"
      - key: ARIA_SEED_DEMO_CATALOG
        value: "false"
      - key: ARIA_DEMO_MARKET_ENABLED
        value: "false"
      - key: ARIA_ADMIN_EMAIL
        sync: false
      - key: ARIA_ADMIN_PASSWORD
        sync: false
      - key: ARIA_JWT_SECRET
        sync: false
